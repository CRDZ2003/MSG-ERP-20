<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MSG Oilfield Portal</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --msg-dark: #0f172a;
            --msg-slate: #1e293b;
            --msg-orange: #f97316;
            --msg-orange-hover: #ea580c;
            --msg-gold: #f59e0b;
        }

        body {
            background-color: #0b1324;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1e293b 0%, #0b1324 100%);
        }

        .login-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
        }

        .brand-badge {
            background: #ffffff;
            padding: 10px 20px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }
        .brand-badge img {
            max-height: 55px;
            width: auto;
            object-fit: contain;
        }

        .btn-msg-primary {
            background: linear-gradient(135deg, var(--msg-orange) 0%, var(--msg-orange-hover) 100%);
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-msg-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(249, 115, 22, 0.45);
            color: white;
        }

        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #ffffff;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: var(--msg-orange);
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.25);
        }

        .credentials-box {
            background-color: #0f172a;
            border: 1px dashed var(--msg-gold);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="brand-badge mb-3">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="MSG Oilfield Logo">
        </div>
        
        <h4 class="fw-bold mb-1 text-white">MSG OILFIELD PORTAL</h4>
        <p class="text-warning small mb-4">Material Solutions Grid &bull; Technical Sourcing</p>

        {% if error %}
        <div class="alert alert-danger py-2 small mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3 text-start">
                <label class="form-label text-gray-300 small fw-semibold">Email / Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope-fill"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="info@msgoilfield.com" required autofocus>
                </div>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label text-gray-300 small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-msg-primary mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Portal
            </button>
        </form>

        <div class="mt-4 text-muted small">
            &copy; 2026 MSG Oilfield — Sourcing - Reliable & Systematic
        </div>
    </div>

</body>
</html>
